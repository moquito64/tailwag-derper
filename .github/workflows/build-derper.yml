name: build tailwag-derper

on:
  push:
    branches: [main]
    paths: ["docker/**", ".github/workflows/build-derper.yml"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./docker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tailwag-derper:latest

# After the first successful run, make the package public in the repo's
# Package settings — otherwise the GCP VM's anonymous `docker pull` in
# startup.sh will fail. (Or swap that pull for a `docker login` using a
# read-only PAT, but a public image is one less credential to manage.)
